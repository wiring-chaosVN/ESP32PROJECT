# ESP-OS development security profile (N16R8)
# This is NOT an ARM TrustZone Secure World / TEE.
# ESP32-S3 World Controller (WCL) + PMS protection are used by NuttX KERNEL
# mode to establish privileged World 0 and restricted World 1 execution.
SECURITY_PROFILE=development
KERNEL_MODE=enabled
WCL=enabled
WORLD0=kernel-privileged
WORLD1=user-restricted
USERFAULT_ABORT=enabled
MMU_ADDRESS_ENVIRONMENT=enabled
PAGE_SIZE=65536
PSRAM_PAGE0_RESERVED=yes

# No irreversible provisioning during development.
EFUSE_BURN=disabled
ESP_SECURE_BOOT=not-enabled-by-this-build
FLASH_ENCRYPTION=not-enabled-by-this-build
SOFTWARE_SIGNATURE_POLICY=not-implemented-in-this-build
CAPABILITY_POLICY=driver-and-service-enforced; not a complete MAC policy
DMA_ISOLATION=not-yet-verified
PERIPHERAL_OWNERSHIP=driver-mediated
