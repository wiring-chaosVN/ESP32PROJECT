# ESP-OS intended mount layout; this file documents policy, it does not
# perform mounts. Runtime MTD discovery and external-rootfs mounting remain
# an integration gate in this build.
/
 /system   ROMFS   ro   required-after-bootstrap
 /data     LittleFS rw   optional-no-autoformat
 /tmp      TMPFS   rw   volatile
 /proc     PROCFS  ro   optional
 /dev      DEVFS   rw   required-for-device-nodes

# Do not format rootfs_data automatically when mount fails.
# Keep bootstrap ROMFS and UART0 recovery available on external rootfs failure.
