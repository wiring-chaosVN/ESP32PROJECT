# ESP-OS UART0 debug console profile
# Physical console: UART0, GPIO43 TX / GPIO44 RX, 115200 baud, 8N1.
# Current implementation uses NuttX NSH as the bring-up command interpreter.
# The console is a normal scheduled user task; it does not busy-wait in kernel code.
CONSOLE_BACKEND=uart0
CONSOLE_BAUD=115200
CONSOLE_FORMAT=8N1
CONSOLE_PROMPT="ESP-OS> "
CONSOLE_MODE=development
CONSOLE_DISPLAY_REQUIRED=no

# Device commands are usable only after the corresponding NuttX driver is
# configured, initialized and registered under /dev. This file does not
# fabricate device nodes or bypass driver ownership.
DEVICE_ACCESS=character-device-and-driver-api
RAW_REGISTER_ACCESS=disabled-by-default
RAW_FLASH_WRITE=disabled-by-default
