# Device access policy for UART0 console
# Example commands depend on drivers compiled into the firmware:
#   ls /dev
#   i2c ...   (only if an I2C controller + driver + i2ctool are enabled)
#   spi ...   (only if the relevant SPI driver/tool is enabled)
#   gpio ...  (only if a GPIO character driver/tool is enabled)
#
# No I2C bus number, SPI bus number, GPIO pin ownership or sensor address is
# hard-coded here. Device Tree / board configuration is authoritative.
DEVICE_DISCOVERY=/dev
BUS_ACCESS=driver-mediated
UNKNOWN_DEVICE=reject
